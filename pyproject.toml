[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masonpy"
version = "0.1.0"
description = "Procedural masonry generation on a discrete grid"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyclipper>=1.3.0.post6,<2"]

[project.scripts]
masonpy-web = "masonpy.app.server:main"

[tool.setuptools.package-data]
"masonpy.app" = ["static/*.html", "static/*.css", "static/*.js"]
